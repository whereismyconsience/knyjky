/* Folio storage — browser IndexedDB, with a clearly identified localStorage fallback
   for browsers that disable IndexedDB in local file previews / private contexts.
   All IndexedDB writes resolve ONLY when the encompassing transaction completes. */
(() => {
  'use strict';
  const DB_NAME = 'folio-personal-library';
  const DB_VERSION = 2;
  const FALLBACK_KEY = 'folio-library-fallback-v2';
  let db = null;
  let mode = 'indexeddb';

  function request(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || Error('Database request failed'));
    });
  }
  function txDone(tx) {
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onabort = () => reject(tx.error || Error('Database transaction aborted'));
      tx.onerror = () => reject(tx.error || Error('Database transaction failed'));
    });
  }
  function connection() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('books')) {
          const s = d.createObjectStore('books', {keyPath: 'id'});
          s.createIndex('isbn', 'isbn', {unique:false});
          s.createIndex('status', 'status', {unique:false});
          s.createIndex('addedAt', 'addedAt', {unique:false});
        }
        if (!d.objectStoreNames.contains('shelves')) d.createObjectStore('shelves', {keyPath:'name'});
        if (!d.objectStoreNames.contains('tombstones')) d.createObjectStore('tombstones', {keyPath:'id'});
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', {keyPath:'key'});
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || Error('Could not open IndexedDB'));
      req.onblocked = () => reject(Error('A different tab has the database open for upgrading.'));
    });
  }
  function fallbackLoad() {
    const str = localStorage.getItem(FALLBACK_KEY);
    if (!str) return {initialized:false,books:[],shelves:[],tombstones:[]};
    const data = JSON.parse(str);
    return {initialized:true,books:data.books||[],shelves:data.shelves||[],tombstones:data.tombstones||[]};
  }
  function fallbackMutate(fn) {
    const current = fallbackLoad();
    fn(current);
    localStorage.setItem(FALLBACK_KEY, JSON.stringify({...current,initialized:true}));
  }
  async function init() {
    try {
      if (!('indexedDB' in window)) throw Error('IndexedDB is unavailable');
      db = await connection();
      db.onversionchange = () => {db.close(); db=null;};
      // Some privacy modes allow opening but not actually writing.
      const tx = db.transaction('meta','readwrite');
      tx.objectStore('meta').put({key:'health-check',value:true});
      await txDone(tx);
      mode = 'indexeddb';
    } catch (err) {
      if (db) db.close();
      db = null;
      mode = 'fallback';
      // Do not discard the cause; the UI explains reduced storage reliability.
      console.warn('Folio: IndexedDB unavailable, localStorage fallback in use.',err);
    }
    return mode;
  }
  async function load() {
    if (!db) return fallbackLoad();
    const tx = db.transaction(['books','shelves','tombstones','meta'],'readonly');
    const completed=txDone(tx);
    const result = await Promise.all([
      request(tx.objectStore('books').getAll()),
      request(tx.objectStore('shelves').getAll()),
      request(tx.objectStore('tombstones').getAll()),
      request(tx.objectStore('meta').get('initialized')),
    ]);
    await completed;
    return {books:result[0],shelves:result[1].map(x=>x.name),tombstones:result[2],initialized:!!result[3]};
  }
  async function putBook(book) {
    if (!db) return fallbackMutate(d=>{d.books=d.books.filter(x=>x.id!==book.id);d.books.push(book);});
    const tx=db.transaction(['books','meta'],'readwrite');
    tx.objectStore('books').put(book);
    tx.objectStore('meta').put({key:'initialized',value:true});
    await txDone(tx);
  }
  async function removeBook(id,tombstone) {
    if (!db) return fallbackMutate(d=>{d.books=d.books.filter(x=>x.id!==id);d.tombstones=d.tombstones.filter(x=>x.id!==id);d.tombstones.push(tombstone);});
    const tx=db.transaction(['books','tombstones'],'readwrite');
    tx.objectStore('books').delete(id);
    tx.objectStore('tombstones').put(tombstone);
    await txDone(tx);
  }
  async function writeShelves(shelves) {
    if (!db) return fallbackMutate(d=>{d.shelves=[...shelves]});
    const tx=db.transaction('shelves','readwrite');
    const store=tx.objectStore('shelves');store.clear();
    for (const name of shelves) store.put({name});
    await txDone(tx);
  }
  async function writeBooksAndShelves(books,shelves) {
    if (!db) return fallbackMutate(d=>{d.books=books;d.shelves=shelves;});
    const tx=db.transaction(['books','shelves'],'readwrite');
    const b=tx.objectStore('books');const s=tx.objectStore('shelves');
    b.clear();s.clear();
    for (const book of books) b.put(book);
    for (const name of shelves) s.put({name});
    await txDone(tx);
  }
  async function replaceAll(books,shelves,tombstones=[]) {
    if (!db) {
      localStorage.setItem(FALLBACK_KEY,JSON.stringify({initialized:true,books,shelves,tombstones}));
      return;
    }
    const tx=db.transaction(['books','shelves','tombstones','meta'],'readwrite');
    const b=tx.objectStore('books'),s=tx.objectStore('shelves'),t=tx.objectStore('tombstones');
    b.clear();s.clear();t.clear();
    for (const book of books) b.put(book);
    for (const name of shelves) s.put({name});
    for (const item of tombstones) t.put(item);
    tx.objectStore('meta').put({key:'initialized',value:true});
    await txDone(tx);
  }
  window.FolioDB = {init,load,putBook,removeBook,writeShelves,writeBooksAndShelves,replaceAll,get mode(){return mode}};
})();

/* Basic zero-dependency EAN-13 scanner for camera frames.
   Browsers with BarcodeDetector use the native implementation first.
   This image decoder is a best-effort fallback: angled, blurred or glared
   barcodes may still need manual ISBN entry. */
(() => {
  'use strict';
  const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
  const G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
  const R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
  const parity=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
  const digit=(seq,patterns)=>patterns.indexOf(seq);
  const checksum=code=>code.length===13&&[...code].reduce((sum,char,i)=>sum+Number(char)*(i%2?3:1),0)%10===0;
  function decode(bits){
    if(bits.length!==95||!bits.startsWith('101')||bits.slice(45,50)!=='01010'||!bits.endsWith('101'))return null;
    let left='',right='',pattern='';
    for(let i=0;i<6;i++){
      const seven=bits.slice(3+i*7,10+i*7);let d=digit(seven,L);if(d>=0){left+=d;pattern+='L';continue}
      d=digit(seven,G);if(d<0)return null;left+=d;pattern+='G';
    }
    for(let i=0;i<6;i++){const d=digit(bits.slice(50+i*7,57+i*7),R);if(d<0)return null;right+=d}
    const leading=parity.indexOf(pattern);if(leading<0)return null;
    const isbn=String(leading)+left+right;
    return /^97[89]/.test(isbn)&&checksum(isbn)?isbn:null;
  }
  function sample(data,y){
    const {width,height}=data,rgba=data.data,gray=new Float32Array(width);
    for(let x=0;x<width;x++){
      let g=0;
      for(let dy=-1;dy<=1;dy++){
        const yy=Math.max(0,Math.min(height-1,y+dy)),i=(yy*width+x)*4;
        g+=rgba[i]*.299+rgba[i+1]*.587+rgba[i+2]*.114;
      }
      gray[x]=g/3;
    }
    return gray;
  }
  function scanLine(line){
    const w=line.length,sorted=Array.from(line).sort((a,b)=>a-b);
    const low=sorted[Math.floor(w*.12)],high=sorted[Math.floor(w*.88)];
    if(high-low<42)return null;
    for(const threshold of [low+(high-low)*.4,low+(high-low)*.52,low+(high-low)*.63]){
      const runs=[];let prev=line[0]<threshold?1:0,start=0;
      for(let i=1;i<=w;i++){
        const curr=i<w?(line[i]<threshold?1:0):1-prev;
        if(curr!==prev){runs.push({value:prev,start,width:i-start});start=i;prev=curr}
      }
      for(let i=0;i<runs.length-3;i++){
        const a=runs[i],b=runs[i+1],c=runs[i+2];
        if(a.value!==1||b.value!==0||c.value!==1)continue;
        const widths=[a.width,b.width,c.width],m=widths.reduce((sum,v)=>sum+v,0)/3;
        if(m<1.1||m>11||Math.max(...widths)>m*1.65||Math.min(...widths)<m*.45)continue;
        if(a.start+95*m>w)continue;
        for(const adjust of [.97,1,1.03]){
          const moduleWidth=m*adjust;
          if(a.start+95*moduleWidth>=w)continue;
          let bits='';
          for(let j=0;j<95;j++){
            const x=Math.min(w-1,Math.max(0,Math.floor(a.start+(j+.5)*moduleWidth)));
            bits+=line[x]<threshold?'1':'0';
          }
          const decoded=decode(bits);if(decoded)return decoded;
        }
      }
    }
    return null;
  }
  function scan(imageData){
    if(!imageData?.data||imageData.width<120)return null;
    for(const position of [.48,.5,.52,.44,.56,.4,.6,.35,.65]){
      const result=scanLine(sample(imageData,Math.floor(imageData.height*position)));
      if(result)return result;
    }
    return null;
  }
  window.FolioBarcode={scan};
})();

      case'storage-info':alert('IndexedDB keeps your records only in this browser profile. Clearing site data, private browsing, or device loss can delete it. Export JSON backups regularly, and use an HTTPS-hosted copy or localhost for reliable storage, offline installation and camera access.');break;
      case'import':document.getElementById('import-input').click();break;
      case'toggle-theme':theme=document.documentElement.dataset.theme==='dark'?'light':'dark';setPref(THEME_KEY,theme);render();break;
      case'isbn-lookup':lookupISBN();break;
      case'open-scan':openDialog({kind:'scan'});startScan();break;
      case'delete-book':deleteBook(el.dataset.id);break;
      case'new-shelf':{const name=plain(prompt('Name your new shelf:'));if(!name)return;if(state.shelves.some(s=>s.toLowerCase()===name.toLowerCase())){toast('That shelf already exists');return}try{await writeShelfSet([...state.shelves,name]);render();toast('Shelf created')}catch(err){saveError(err)}break}
      case'reset-demo':if(confirm('Restore the sample collection? This replaces your current books. Export a backup first.')){try{await FolioDB.replaceAll(structuredClone(sample),DEFAULT_SHELVES,[]);state.books=structuredClone(sample);state.shelves=[...DEFAULT_SHELVES];state.tombstones=[];render();toast('Sample books restored')}catch(err){saveError(err)}}break;
      case'clear-all':if(confirm('Delete ALL books stored in this browser? Export a backup first if needed.')){try{const deleted=state.books.map(b=>({id:b.id,updatedAt:new Date().toISOString()}));await FolioDB.replaceAll([],state.shelves,[...state.tombstones,...deleted]);state.books=[];state.tombstones.push(...deleted);render();toast('Library cleared')}catch(err){saveError(err)}}break;
      case'rename-shelf':await renameShelf(el.dataset.shelfName);break;
      case'delete-shelf':await deleteShelf(el.dataset.shelfName);break;
    }
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.dialog)closeDialog();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.book-card')){e.preventDefault();openDialog({kind:'detail',bookId:e.target.dataset.book})}});
  document.addEventListener('input',e=>{if(e.target.id==='library-search'){state.query=e.target.value;updateLibraryResults()}if(e.target.id==='form-cover'&&e.target.value){const img=document.getElementById('form-cover-preview');if(img)img.src=e.target.value;state.formCover=e.target.value}});
  document.addEventListener('change',async e=>{
    if(e.target.id==='library-sort'){state.sort=e.target.value;updateLibraryResults()}
    if(e.target.dataset.quickStatus)changeStatus(e.target.dataset.quickStatus,e.target.value);
    if(e.target.id==='cover-upload'&&e.target.files?.[0]){try{state.formCover=await compressImage(e.target.files[0]);document.getElementById('form-cover-preview').src=state.formCover;document.getElementById('form-cover').value='';toast('Cover image ready')}catch(err){alert(err.message)}}
    if(e.target.id==='import-input'&&e.target.files?.[0]){await importBackup(e.target.files[0]);e.target.value=''}
  });
  document.addEventListener('submit',e=>{if(!['book-form','filters-form','progress-form','note-form','edit-note-form','manual-isbn-form'].includes(e.target.id))return;e.preventDefault();const form=e.target;
    if(form.id==='book-form')handleBookSave(form);
    if(form.id==='filters-form'){state.filters=Object.fromEntries(new FormData(form));closeDialog();render()}
    if(form.id==='progress-form'){const old=findBook(state.dialog?.bookId);if(!old)return;const b={...old,currentPage:Math.max(0,Math.min(Number(old.pages)||999999,Number(new FormData(form).get('currentPage'))||0)),updatedAt:new Date().toISOString()};writeBook(b).then(()=>{renderDialog();render();toast('Reading progress saved')}).catch(saveError)}
    if(form.id==='note-form'){const old=findBook(state.dialog?.bookId);if(!old)return;const b=withNote(old,new FormData(form).get('note'));writeBook(b).then(()=>{renderDialog();render();toast('Note added')}).catch(saveError)}
    if(form.id==='edit-note-form'){const old=findBook(state.dialog?.bookId);const noteId=form.dataset.noteId;const body=plain(new FormData(form).get('note'));if(!old||!body)return;const b={...old,notes:(old.notes||[]).map(n=>n.id===noteId?{...n,body,date:new Date().toISOString()}:n),updatedAt:new Date().toISOString()};writeBook(b).then(()=>{state.editingNoteId=null;renderDialog();render();toast('Note updated')}).catch(saveError)}
    if(form.id==='manual-isbn-form'){const isbn=plain(new FormData(form).get('isbn')).replace(/[\s-]/g,'');stopScan();openDialog({kind:'form',prefill:isbn});lookupISBN()}
  });
  document.addEventListener('error',e=>{const img=e.target;if(img instanceof HTMLImageElement&&img.dataset.coverTitle&&!img.dataset.fallback){img.dataset.fallback='1';img.src=placeholderCover(img.dataset.coverTitle)}},true);
  window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(theme==='system')applyTheme()});
  boot();
})();

  </script>
