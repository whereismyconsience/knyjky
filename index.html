<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f8f5">
  <meta name="description" content="Folio, a calm home for your personal library.">
  <title>Folio — Your Personal Library</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icons/folio-192.png">
  <script src="db.js" defer></script>
  <script src="barcode.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2Z"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="m4 19 1-15m5 15V4m5 15V4m4-1 2 16M2 22h20M3 4h17"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10Z"/><path d="M9 21v-8h6v8"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4m6 0h4a1 1 0 0 1 1 1v4m0 6v4a1 1 0 0 1-1 1h-4m-6 0H5a1 1 0 0 1-1-1v-4M7 10v4m3-6v8m3-6v4m4-6v8"/></symbol>
    <symbol id="i-shelves" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="6" width="5" height="14" rx="1"/><path d="m16 5 4-1 3 15-4 1-3-15ZM2 22h20"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/><circle cx="8" cy="7" r="2" fill="currentColor" stroke="none"/><circle cx="16" cy="17" r="2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.8 14.5A9 9 0 019.5 3.2a9 9 0 1011.3 11.3Z"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5m7-7-7 7 7 7"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10m-7 5h4M8 4v6m8 0v5"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M3 6h.01M3 12h.01M3 18h.01" stroke-linecap="round" stroke-width="3"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="16" rx="3"/><path d="M16 14h6M4 5V3h15"/><circle cx="17" cy="14" r=".8" fill="currentColor"/></symbol>
    <symbol id="i-book-open" viewBox="0 0 24 24"><path d="M12 6a9 9 0 0 0-9-2v15a9 9 0 0 1 9 2 9 9 0 0 1 9-2V4a9 9 0 0 0-9 2Zm0 0v15"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16 4l4 4L9 19l-5 1 1-5L16 4Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6m5 4v7m4-7v7"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 17V4m-5 5 5-5 5 5M4 17v4h16v-4"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 7h5l2-3h4l2 3h5v13H3V7Z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 16-5-5L5 21"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M4 3h16v18H4zM8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 10v7M12 7h.01"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8V3l-4 4a9 9 0 1 0 4 8M20 8h-5"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M12 3H3v9l9 9 9-9-9-9Z"/><circle cx="7.5" cy="7.5" r="1.2"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.6 5.6 0 0 0-7.9 0l-.9.9-.9-.9a5.6 5.6 0 0 0-7.9 7.9l.9.9L12 21l7.9-7.6.9-.9a5.6 5.6 0 0 0 0-7.9Z"/></symbol>
    <symbol id="i-cloud-off" viewBox="0 0 24 24"><path d="m3 3 18 18M7 7a6 6 0 0 1 11 4 5 5 0 0 1 2 8H8a5 5 0 0 1-4-8"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M8 4v16m-4-4 4 4 4-4m4-12v16m-4-12 4-4 4 4"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Z"/></symbol>
  </svg>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <a href="#home" class="brand" data-page="home" aria-label="Folio Home">
        <span class="brand-symbol" aria-hidden="true"><svg class="icon"><use href="#i-book-open"></use></svg></span>
        <span><strong>folio<span class="brand-dot">.</span></strong><small>PERSONAL LIBRARY</small></span>
      </a>
      <div class="side-caption">YOUR SPACE</div>
      <nav class="side-nav" id="side-nav">
        <button type="button" class="nav-item" data-page="home"><svg class="icon"><use href="#i-home"></use></svg> Overview</button>
        <button type="button" class="nav-item" data-page="library"><svg class="icon"><use href="#i-library"></use></svg> My library</button>
        <button type="button" class="nav-item" data-page="shelves"><svg class="icon"><use href="#i-shelves"></use></svg> My shelves</button>
        <button type="button" class="nav-item" data-page="settings"><svg class="icon"><use href="#i-settings"></use></svg> Settings</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-message"><svg class="icon"><use href="#i-spark"></use></svg><p>A little world<br><em>of your own.</em></p><span>Keep every story close.</span></div>
        <div class="privacy-indicator"><svg class="icon"><use href="#i-cloud-off"></use></svg> Stored locally on this device</div>
      </div>
    </aside>
    <div class="main-pane">
      <header class="topbar">
        <div class="topbar-brand"><span class="topbar-mark"><svg class="icon"><use href="#i-book-open"></use></svg></span><strong>folio<span class="brand-dot">.</span></strong></div>
        <div class="topbar-right"><span class="topbar-caption">A home for your books</span><button type="button" class="icon-btn theme-toggle" data-action="toggle-theme" aria-label="Toggle dark mode"><svg class="icon"><use href="#i-moon"></use></svg></button><button type="button" class="avatar" data-page="settings" title="Settings">F</button></div>
      </header>
      <main id="view" class="main-content" tabindex="-1"></main>
    </div>
  </div>
  <nav class="mobile-nav" aria-label="Mobile navigation" id="mobile-nav">
    <button type="button" data-page="home"><svg class="icon"><use href="#i-home"></use></svg><span>Home</span></button>
    <button type="button" data-page="library"><svg class="icon"><use href="#i-library"></use></svg><span>Library</span></button>
    <button type="button" class="mobile-add" data-action="add-book" aria-label="Add book"><svg class="icon"><use href="#i-plus"></use></svg></button>
    <button type="button" data-page="shelves"><svg class="icon"><use href="#i-shelves"></use></svg><span>Shelves</span></button>
    <button type="button" data-page="settings"><svg class="icon"><use href="#i-settings"></use></svg><span>Settings</span></button>
  </nav>
  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
  <input type="file" id="import-input" accept="application/json,text/csv,.json,.csv" hidden>
</body>
</html>
